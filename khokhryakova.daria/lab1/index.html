<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лабораторная работа 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="product-card">
      <img class="product-image" src="assets/image.jpg" alt="Наушники Sony" />
      <h2 class="product-title">Наушники Sony</h2>
      <p class="product-description">
        Беспроводные наушники с активным шумоподавлением, до 30 часов работы и
        премиальным звуком.
      </p>
      <div class="reviews">
        <h3 class="reviews-title">Отзывы</h3>
        <ul class="reviews-list">
          <li class="review">
            <span class="review-name">Анна</span>
            <p class="review-text">Отличный звук, очень довольна покупкой!</p>
          </li>
          <li class="review">
            <span class="review-name">Иван</span>
            <p class="review-text">
              Шумоподавление работает на ура. Рекомендую.
            </p>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
